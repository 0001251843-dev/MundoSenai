<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulação de Balanço VR - WebXR</title>
  <!-- Biblioteca A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script>
    // Componente JS para Ligar / Desligar o balanço com o olhar
    AFRAME.registerComponent('controle-balanco', {
      schema: { ativo: { type: 'boolean', default: true } },
      init: function () {
        const pivot = document.querySelector('#pivo-balanco');
        const botao = this.el;

        botao.addEventListener('click', () => {
          this.data.ativo = !this.data.ativo;
          if (this.data.ativo) {
            pivot.emit('iniciar-balanco');
            botao.setAttribute('color', '#E74C3C'); // Vermelho
          } else {
            pivot.emit('parar-balanco');
            botao.setAttribute('color', '#2ECC71'); // Verde
          }
        });
      }
    });
  </script>
</head>
<body>
  <a-scene background="color: #87CEEB">

    <!-- ILUMINAÇÃO DO AMBIENTE -->
    <a-entity type="ambient" color="#AAAAAA"></a-entity>
    <a-entity type="directional" position="-2 5 2" intensity="0.8"></a-entity>

    <!-- CENÁRIO EXTERNO (Essencial para o cérebro perceber a velocidade e movimento) -->
    <!-- Piso / Gramado -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="40" height="40" color="#4CAF50" roughness="0.9"></a-plane>
    <!-- Céu -->
    <a-sky color="#87CEEB"></a-sky>

    <!-- Árvores e Elementos de Referência Visual -->
    <a-entity position="-5 0 -6">
      <a-cylinder position="0 1.5 0" radius="0.25" height="3" color="#795548"></a-cylinder>
      <a-cone position="0 4 0" radius-bottom="1.8" radius-top="0" height="3.5" color="#2E7D32"></a-cone>
    </a-entity>

    <a-entity position="5 0 -7">
      <a-cylinder position="0 1.5 0" radius="0.25" height="3" color="#795548"></a-cylinder>
      <a-cone position="0 4 0" radius-bottom="2" radius-top="0" height="4" color="#1B5E20"></a-cone>
    </a-entity>

    <!-- Fachada do Laboratório SENAI ao Fundo -->
    <a-box position="0 3 -12" width="12" height="6" depth="0.5" color="#005A9C"></a-box>
    <a-text value="SENAI - SIMULACAO DE BALANCO VR" position="0 5.2 -11.7" align="center" width="8" color="#FFFFFF"></a-text>


    <!-- ======================================================== -->
    <!-- ESTRUTURA FIXA DO BALANÇO (Estrutura de sustentação)    -->
    <!-- ======================================================== -->
    <!-- Trave Superior (Eixo) -->
    <a-cylinder position="0 3.2 0" rotation="0 0 90" radius="0.06" height="3.2" color="#333333"></a-cylinder>
    <!-- Pés Laterais em 'A' (Esquerda) -->
    <a-cylinder position="-1.5 1.6 0.6" rotation="20 0 -15" radius="0.05" height="3.4" color="#333333"></a-cylinder>
    <a-cylinder position="-1.5 1.6 -0.6" rotation="-20 0 -15" radius="0.05" height="3.4" color="#333333"></a-cylinder>
    <!-- Pés Laterais em 'A' (Direita) -->
    <a-cylinder position="1.5 1.6 0.6" rotation="20 0 15" radius="0.05" height="3.4" color="#333333"></a-cylinder>
    <a-cylinder position="1.5 1.6 -0.6" rotation="-20 0 15" radius="0.05" height="3.4" color="#333333"></a-cylinder>


    <!-- ======================================================== -->
    <!-- PIVÔ MÓVEL E VISÃO VR DO USUÁRIO (PENDULO ANIMADO)       -->
    <!-- ======================================================== -->
    <a-entity id="pivo-balanco" 
              position="0 3.1 0"
              animation="property: rotation.x; from: -35; to: 35; dir: alternate; loop: true; dur: 1800; easing: easeInOutSine; startEvents: iniciar-balanco; pauseEvents: parar-balanco">
      
      <!-- Correntes / Cordas do Balanço -->
      <a-cylinder position="-0.45 -1.1 0" radius="0.015" height="2.2" color="#888888"></a-cylinder>
      <a-cylinder position="0.45 -1.1 0" radius="0.015" height="2.2" color="#888888"></a-cylinder>

      <!-- Assento de Madeira -->
      <a-box position="0 -2.2 0" width="1.1" height="0.05" depth="0.4" color="#8B4513"></a-box>

      <!-- VISÃO DO USUÁRIO (Câmera VR embarcada na altura dos olhos de quem está sentado) -->
      <a-camera position="0 -1.6 0" look-controls>
        <!-- Mira / Cursor visual para acionar interações olhando para elas -->
        <a-cursor
          id="cursor"
          color="#FFD700"
          raycaster="objects: .interativo"
          fuse="true"
          fuse-timeout="1200"
          animation__click="property: scale; startEvents: click; easing: easeInCubic; durability: 150; from: 0.1 0.1 0.1; to: 1 1 1"
          animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; durability: 1200; from: 1 1 1; to: 0.1 0.1 0.1">
        </a-cursor>
      </a-camera>

    </a-entity>


    <!-- ======================================================== -->
    <!-- PAINEL INTERATIVO DE CONTROLE                            -->
    <!-- ======================================================== -->
    <a-box class="interativo" 
           controle-balanco 
           position="2.2 0.3 -2" 
           width="0.8" height="0.4" depth="0.6" 
           color="#E74C3C">
      <a-text value="OLHE PARA PARAR / LIGAR" position="0 0.25 0" rotation="-90 0 0" align="center" width="2" color="#FFFFFF"></a-text>
    </a-box>

  </a-scene>
</body>
</html>
